<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1836" />
      <stop offset="70%" stop-color="#060914" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="2" />

  <!-- Outer Orbital Rings -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad1)" stroke-width="3" stroke-dasharray="16 10 32 10" opacity="0.65" />
    <circle cx="256" cy="256" r="120" fill="none" stroke="url(#ringGrad2)" stroke-width="2.5" stroke-dasharray="8 6 24 6" opacity="0.8" />
  </g>

  <!-- Core Pulsing Glow -->
  <circle cx="256" cy="256" r="90" fill="url(#coreGlow)" />
  <circle cx="256" cy="256" r="42" fill="#ffffff" opacity="0.95" filter="url(#glow)" />

  <!-- Inner Geometric Aperture / AURA Symbol -->
  <path d="M 256 168 L 312 256 L 256 344 L 200 256 Z" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9" />
  <circle cx="256" cy="256" r="14" fill="#00f0ff" />
</svg>
